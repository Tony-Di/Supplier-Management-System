<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;500;600;700&display=swap">
  <style>
    body { margin: 0; background: #0D0D0D; color: #FFFFFF; font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; font-size: 14px; line-height: 1.45; }
    a { color: #E00700; text-decoration: none; }
    a:hover { color: #FF3A33; }
    .kan { font-family: Kanit, "Helvetica Neue", Helvetica, Arial, sans-serif; }
  </style>
</helmet>

<div style="min-height: 840px; background: #0D0D0D; display: flex; align-items: center; justify-content: center; position: relative; overflow: hidden;">

  <!-- faint grid, industrial texture -->
  <svg width="100%" height="840" style="position: absolute; inset: 0; opacity: 0.35;">
    <defs>
      <pattern id="g" width="64" height="64" patternUnits="userSpaceOnUse">
        <path d="M64 0H0V64" fill="none" stroke="#1C1C1C" stroke-width="1"></path>
      </pattern>
    </defs>
    <rect width="100%" height="840" fill="url(#g)"></rect>
  </svg>

  <!-- red hairline frame -->
  <div style="position: absolute; left: 48px; top: 48px; right: 48px; bottom: 48px; border: 1px solid #1F1F1F;"></div>
  <div style="position: absolute; left: 48px; top: 48px; width: 120px; height: 3px; background: #E00700;"></div>

  <div style="position: relative; width: 380px;">
    <img src="seg-logo-white.svg" alt="SEG Solar" style="display: block; width: 176px; height: 29px; margin: 0 auto 10px;">
    <div class="kan" style="text-align: center; color: #8A8A8A; font-size: 11px; letter-spacing: 0.22em; text-transform: uppercase;">Global Sourcing</div>

    <div style="height: 1px; background: #1F1F1F; margin: 34px 0 30px;"></div>

    <div style="display: flex; flex-direction: column; gap: 16px;">
      <label style="display: block;">
        <span class="kan" style="display: block; color: #8A8A8A; font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 7px;">Work email</span>
        <div style="height: 46px; border: 1px solid #2E2E2E; background: #141414; display: flex; align-items: center; padding: 0 14px; color: #E8E8E8; font-size: 14px;">di.zhou@segsolar.com</div>
      </label>
      <label style="display: block;">
        <span class="kan" style="display: block; color: #8A8A8A; font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 7px;">Password</span>
        <div style="height: 46px; border: 1px solid #E00700; background: #141414; display: flex; align-items: center; justify-content: space-between; padding: 0 14px; color: #E8E8E8; letter-spacing: 0.3em;">••••••••
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6E6E6E" stroke-width="1.6"><path d="M2 12s3.6-6 10-6 10 6 10 6-3.6 6-10 6-10-6-10-6z"></path><circle cx="12" cy="12" r="2.6"></circle></svg>
        </div>
      </label>

      <div class="kan" style="height: 46px; background: #E00700; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; margin-top: 6px;">Sign in</div>

      <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 4px;">
        <span style="color: #6E6E6E; font-size: 12px;">No account? <span style="color: #E8E8E8;">Register</span></span>
        <span style="color: #6E6E6E; font-size: 12px;">Forgot password</span>
      </div>
    </div>

    <div style="margin-top: 40px; text-align: center; color: #4A4A4A; font-size: 11px; letter-spacing: 0.06em;">@segsolar.com accounts only</div>
  </div>
</div>
</x-dc>
</body>
</html>
